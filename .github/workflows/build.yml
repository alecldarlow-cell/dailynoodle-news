name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'
    - cron: '47 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build.js
      - run: node tools/check.js
      - name: Commit generated files
        run: |
          git config user.name "dailynoodle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json reports
          git diff --cached --quiet || (git commit -m "chore: rebuild feed.json [skip ci]" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Wait until the run's artifact list shows the upload (22 Nov 2026: deploys failed with "Found 1 artifact(s)").
      - name: Wait for the site artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[]|select(.name=="github-pages")]|length')
            [ "$n" = "1" ] && echo "listed after ${i} check(s)" && exit 0
            sleep 5
          done
          echo "not listed after 150 s; deploying anyway"
      - id: deploy
        uses: actions/deploy-pages@v4
